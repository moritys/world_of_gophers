services:
  bot:
    build: .
    container_name: world_of_gophers
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - db

  db:
    container_name: postgres
    image: postgres:17

    environment:
      POSTGRES_USER: MASHA
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: wog
      PGDATA: /data/postgres

    volumes:
      - db:/data/postgres

    ports:
      - "5332:5432"

    networks:
      - db

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U MASHA -d wog"]
      interval: 5s
      timeout: 10s
      start_period: 10s
      retries: 5

networks:
  db:
    driver: bridge

volumes:
  db:
